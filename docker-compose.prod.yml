services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-socioconnect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-socioconnect}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-socioconnect}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MCP_PORT: 8010
      API_BASE_URL: http://api:8000
      API_RESOURCE_URL: https://api.socioconnect.app
      MCP_RESOURCE_URL: https://mcp.socioconnect.app/mcp
    depends_on:
      - api
    ports:
      - "8010:8010"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.socioconnect.app
      NEXT_PUBLIC_MCP_URL: https://mcp.socioconnect.app/mcp
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
